name: 'license-sentinel'
description: 'License compliance gate: allow/deny lists, copyleft vs project license, unknown licenses, plus CycloneDX/SPDX SBOMs and NOTICES'
author: 'Louis Wright'
branding: { icon: 'shield', color: 'blue' }
inputs:
  path: { description: 'Project directory (default: repository root)', default: '.' }
  source: { description: 'auto | node_modules | lockfile | path to a lockfile', default: 'auto' }
  preset: { description: 'permissive | weak-copyleft | strong-copyleft', default: '' }
  allow: { description: 'Comma-separated allowed licenses/categories', default: '' }
  deny: { description: 'Comma-separated denied licenses (globs ok)', default: '' }
  include-dev: { description: 'Also audit devDependencies (true/false)', default: 'false' }
  fail-on: { description: 'critical | high | medium | low | info | none', default: 'high' }
  config: { description: 'Path to JSON config file', default: '' }
  sarif: { description: 'Write SARIF to this path', default: '' }
  json: { description: 'Write JSON report to this path', default: '' }
  cyclonedx: { description: 'Write a CycloneDX 1.5 SBOM to this path', default: '' }
  spdx: { description: 'Write an SPDX 2.3 SBOM to this path', default: '' }
  notices: { description: 'Write a third-party NOTICES file to this path', default: '' }
  job-summary: { description: 'Write the Markdown report to the job summary (true/false)', default: 'true' }
  args: { description: 'Extra CLI arguments', default: '' }
outputs:
  markdown-file: { description: 'Path of the Markdown report', value: '${{ steps.run.outputs.markdown-file }}' }
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with: { node-version: '20' }
    - id: run
      shell: bash
      env:
        LS_PATH: ${{ inputs.path }}
        LS_SOURCE: ${{ inputs.source }}
        LS_PRESET: ${{ inputs.preset }}
        LS_ALLOW: ${{ inputs.allow }}
        LS_DENY: ${{ inputs.deny }}
        LS_DEV: ${{ inputs.include-dev }}
        LS_FAIL_ON: ${{ inputs.fail-on }}
        LS_CONFIG: ${{ inputs.config }}
        LS_SARIF: ${{ inputs.sarif }}
        LS_JSON: ${{ inputs.json }}
        LS_CDX: ${{ inputs.cyclonedx }}
        LS_SPDX: ${{ inputs.spdx }}
        LS_NOTICES: ${{ inputs.notices }}
        LS_SUMMARY: ${{ inputs.job-summary }}
        LS_ARGS: ${{ inputs.args }}
        LS_BIN: ${{ github.action_path }}/bin/license-sentinel.js
        FORCE_COLOR: '1'
      run: |
        md="$RUNNER_TEMP/license-sentinel.md"
        args=("$LS_PATH" --source "$LS_SOURCE" --fail-on "$LS_FAIL_ON" --markdown "$md")
        [ -n "$LS_PRESET" ] && args+=(--preset "$LS_PRESET")
        [ -n "$LS_ALLOW" ] && args+=(--allow "$LS_ALLOW")
        [ -n "$LS_DENY" ] && args+=(--deny "$LS_DENY")
        [ "$LS_DEV" = "true" ] && args+=(--include-dev)
        [ -n "$LS_CONFIG" ] && args+=(--config "$LS_CONFIG")
        [ -n "$LS_SARIF" ] && args+=(--sarif "$LS_SARIF")
        [ -n "$LS_JSON" ] && args+=(--json "$LS_JSON")
        [ -n "$LS_CDX" ] && args+=(--cyclonedx "$LS_CDX")
        [ -n "$LS_SPDX" ] && args+=(--spdx "$LS_SPDX")
        [ -n "$LS_NOTICES" ] && args+=(--notices "$LS_NOTICES")
        set +e
        # shellcheck disable=SC2086
        node "$LS_BIN" "${args[@]}" $LS_ARGS
        code=$?
        set -e
        echo "markdown-file=$md" >> "$GITHUB_OUTPUT"
        if [ "$LS_SUMMARY" = "true" ] && [ -f "$md" ]; then cat "$md" >> "$GITHUB_STEP_SUMMARY"; fi
        exit $code
